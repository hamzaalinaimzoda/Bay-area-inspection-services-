          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-WG2RBC5N';
          document.head.appendChild(s);
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGtmScript, { timeout: 4000 });
        } else {
          setTimeout(loadGtmScript, 2000);
        }
      });
    </script>

    <!-- Google Ads conversion tag. gtag.js itself costs ~350ms of main-thread
         script evaluation and 60KB of mostly-unused JS on first load — real
         weight, measured, that was landing squarely inside the LCP/TBT
         window when loaded eagerly. Nothing about conversion tracking needs
         to be ready in the first 100ms, so dataLayer/gtag are defined
         immediately (cheap — just a queue), but the actual script tag is
         only injected once the browser is idle after load. Calls made before
         that — including any from src/lib/analytics.ts — still queue
         correctly since gtag() just pushes to dataLayer. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18237540837');
      function loadGtagScript() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18237540837';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        window.addEventListener('load', function () {
          requestIdleCallback(loadGtagScript, { timeout: 4000 });
        });
      } else {
        window.addEventListener('load', function () {
          setTimeout(loadGtagScript, 2000);
        });
      }
    </script>
    <!-- Non-essential analytics loads after the page is ready and idle.

      function loadPlausible() {
        if (document.getElementById('plausible-script')) return;
        var script = document.createElement('script');
        script.id = 'plausible-script';
        script.async = true;
        script.defer = true;
        script.src = 'https://plausible.io/js/script.js';
        script.setAttribute('data-domain', 'inspectbayarea.com');

        if ('requestIdleCallback' in window) {
